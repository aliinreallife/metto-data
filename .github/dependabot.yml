version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: "UTC"
    open-pull-requests-limit: 3
    groups:
      tooling:
        patterns:
          - "@types/*"
          - "tsx"
          - "typescript"
          - "vitest"
    commit-message:
      prefix: "chore(deps)"
