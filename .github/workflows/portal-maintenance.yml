name: Publish saved portal reports
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  id-token: write
concurrency:
  group: portal-maintenance
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Publish private outbox (summary only)
        env:
          DATA_PORTAL_ORIGIN: ${{ vars.DATA_PORTAL_ORIGIN || 'https://novus-peach-seven.vercel.app' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/reconcile-portal.mjs
