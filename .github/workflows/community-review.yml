name: Apply owner-approved community correction
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
  id-token: write
concurrency:
  group: portal-community-review
  cancel-in-progress: false
jobs:
  apply:
    if: github.actor == github.repository_owner && (github.event.label.name == 'data:accepted' || github.event.label.name == 'data:rejected') && contains(github.event.issue.body, '<!-- metto-data-report:')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          submodules: recursive
          # This owner-only job pushes its validated generated correction.
          persist-credentials: true
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate and apply the explicitly approved fields
        env:
          DATA_PORTAL_ORIGIN: https://data.metto.ir
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/review-community.mjs
