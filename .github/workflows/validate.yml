name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Enforce immutable third-party action references
        run: pnpm workflows:check
      - name: Check source provenance
        run: pnpm provenance:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Build all registered cities
        run: pnpm build
      - name: Check committed dataset reproducibility
        run: pnpm generated:check
      - name: Validate all cities
        run: pnpm validate
      - name: Regression tests
        run: pnpm test
      - name: Build Vercel portal from the same canonical data
        run: pnpm portal:build
      - name: Portal typecheck
        run: pnpm portal:typecheck
      - name: Check construction map source snapshot
        run: pnpm map-reference:check
      - name: Install browser for contribution flow checks
        run: pnpm --filter @metto/data-portal exec playwright install --with-deps chromium
      - name: Check contribution flow and accessibility
        run: pnpm portal:test:ui
      - name: Verify Tehran remains independently release-ready
        run: pnpm check-release --city tehran
      - name: Produce evidence and quality report
        if: always()
        run: pnpm quality:report
      - name: Add quality report to job summary
        if: always()
        run: |
          if [ -f .quality-report/quality-report.md ]; then
            cat .quality-report/quality-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metto-data-quality-${{ github.run_id }}
          path: .quality-report/
          # The report directory is hidden; upload-artifact v4 excludes it
          # by default. Keep the opt-in scoped to this generated directory.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
